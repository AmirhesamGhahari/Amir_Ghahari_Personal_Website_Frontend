AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CI/CD pipeline for the portfolio site.
  Creates: S3 (website + artifact), IAM roles, CodeBuild, CodePipeline,
  and a CodeStar GitHub connection.
  The pipeline is self-updating: Stage 2 re-deploys this file automatically on every push,
  so changes to infra/pipeline.yaml are applied without any manual CLI command.
  After deploying, activate the GitHub connection in the AWS Console
  (CodePipeline → Settings → Connections → Update pending connection).

Parameters:
  GitHubOwner:
    Type: String
    Description: Your GitHub username (e.g. amirhesamghahari)

  GitHubRepo:
    Type: String
    Description: Repository name (e.g. amir-ghahari-dev-frontend-repo)

  GitHubBranch:
    Type: String
    Default: main
    Description: Branch to watch for deployments

  WebsiteBucketName:
    Type: String
    Description: S3 bucket name for the deployed site — must be globally unique (e.g. amir-ghahari-website)

  ArtifactBucketName:
    Type: String
    Description: S3 bucket name for CodePipeline artifacts — must be globally unique (e.g. amir-ghahari-pipeline-artifacts)

Resources:

  # ── 1. GitHub connection ────────────────────────────────────────────────────
  # Created in PENDING state. After the stack deploys, go to:
  # AWS Console → CodePipeline → Settings → Connections → Update pending connection
  GithubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: amir-portfolio-github
      ProviderType: GitHub

  # ── 2. S3 bucket — website files ────────────────────────────────────────────
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref WebsiteBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html

  # ── 3. Bucket policy — public read ──────────────────────────────────────────
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${WebsiteBucketName}/*'

  # ── 4. S3 bucket — CodePipeline artifacts (private) ─────────────────────────
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ArtifactBucketName
      VersioningConfiguration:
        Status: Enabled

  # ── 5. IAM role for CloudFormation — used by the self-update stage ───────────
  # This is the role CloudFormation assumes when Stage 2 re-deploys this file.
  # Needs broad permissions because this template creates IAM roles, S3, CodeBuild, etc.
  CloudFormationDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-cfn-deploy-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  # ── 6. IAM role for CodeBuild ───────────────────────────────────────────────
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-codebuild-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${ArtifactBucket}'
                  - !Sub 'arn:aws:s3:::${ArtifactBucket}/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${WebsiteBucketName}'
                  - !Sub 'arn:aws:s3:::${WebsiteBucketName}/*'

  # ── 7. IAM role for CodePipeline ────────────────────────────────────────────
  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-codepipeline-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref GithubConnection
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${ArtifactBucket}'
                  - !Sub 'arn:aws:s3:::${ArtifactBucket}/*'
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt BuildProject.Arn
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt CodeBuildRole.Arn
                  - !GetAtt CloudFormationDeployRole.Arn

  # ── 8. CodeBuild project ─────────────────────────────────────────────────────
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-build'
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: BUCKET_NAME
            Value: !Ref WebsiteBucketName
      ServiceRole: !GetAtt CodeBuildRole.Arn

  # ── 9. CodePipeline ──────────────────────────────────────────────────────────
  DeployPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${AWS::StackName}-pipeline'
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:

        # Stage 1 — download source from GitHub
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GithubConnection
                FullRepositoryId: !Sub '${GitHubOwner}/${GitHubRepo}'
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceArtifact

        # Stage 2 — re-deploy this CloudFormation stack from the latest infra/pipeline.yaml
        # If nothing changed in the file, CloudFormation completes immediately (no-op).
        # If you edited the file, CloudFormation applies the changes before Stage 3 runs.
        - Name: DeployInfrastructure
          Actions:
            - Name: UpdatePipelineStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub '${AWS::StackName}'
                TemplatePath: SourceArtifact::infra/pipeline.yaml
                Capabilities: CAPABILITY_NAMED_IAM
                RoleArn: !GetAtt CloudFormationDeployRole.Arn
              InputArtifacts:
                - Name: SourceArtifact

        # Stage 3 — build the site and upload to S3
        - Name: Build
          Actions:
            - Name: BuildAndDeploy
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact

Outputs:

  WebsiteBucketName:
    Description: S3 bucket where site files are deployed
    Value: !Ref WebsiteBucket

  WebsiteBucketURL:
    Description: S3 static website endpoint (HTTP only — use this to verify files are there)
    Value: !Sub 'http://${WebsiteBucketName}.s3-website-${AWS::Region}.amazonaws.com'

  CodeStarConnectionArn:
    Description: >
      Activate this connection manually after the stack deploys:
      AWS Console → CodePipeline → Settings → Connections → Update pending connection
    Value: !Ref GithubConnection
