AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CI/CD stack for the portfolio site.
  Creates: CodeStar GitHub connection, artifact S3 bucket, IAM roles, CodeBuild, and CodePipeline.
  The pipeline is self-updating: Stage 2 re-deploys this file (infra/cicd.yaml) automatically
  on every push, and also deploys infra/frontend.yaml to a separate frontend stack.
  After bootstrapping, activate the GitHub connection in the AWS Console
  (CodePipeline → Settings → Connections → Update pending connection).

Parameters:
  GitHubOwner:
    Type: String
    Default: AmirhesamGhahari
    Description: Your GitHub username (e.g. amirhesamghahari)

  GitHubRepo:
    Type: String
    Default: Amir_Ghahari_Personal_Website_Frontend
    Description: Repository name (e.g. amir-ghahari-dev-frontend-repo)

  GitHubBranch:
    Type: String
    Default: main
    Description: Branch to watch for deployments

  WebsiteBucketName:
    Type: String
    Default: amirghahari-website-frontend-contexts
    Description: S3 bucket name for the site files — must match the name in infra/frontend.yaml

  GithubConnectionName:
    Type: String
    Default: amir-ghahari-github
    Description: Name of Github connection crrated by AWS CodePipeline

  ArtifactBucketName:
    Type: String
    Default: amirghahari-website-frontend-pipeline-artifacts
    Description: S3 bucket name for CodePipeline artifacts — must be globally unique

  FoundationStackName:
    Type: String
    Default: amirghahari-frontend-foundation
    Description: CloudFormation stack name for infra/frontend.yaml (the website S3 bucket stack)

Resources:

  # ── 1. GitHub connection ────────────────────────────────────────────────────
  GithubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: !Ref GithubConnectionName
      ProviderType: GitHub

  # ── 2. S3 bucket — CodePipeline artifacts (private) ─────────────────────────
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ArtifactBucketName
      VersioningConfiguration:
        Status: Enabled

  CloudFormationDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-cfn-deploy-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      Tags:
        - Key: app
          Value: amirghahari-website-frontend

  # ── 4. IAM role for CodeBuild ───────────────────────────────────────────────
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-codebuild-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      Tags:
        - Key: app
          Value: amirghahari-website-frontend

  # ── 5. IAM role for CodePipeline ────────────────────────────────────────────
  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-codepipeline-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      Tags:
        - Key: app
          Value: amirghahari-website-frontend

  # ── 6. CodeBuild project ─────────────────────────────────────────────────────
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-build'
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: BUCKET_NAME
            Value: !Ref WebsiteBucketName
      ServiceRole: !GetAtt CodeBuildRole.Arn

  # ── 7. CodePipeline ──────────────────────────────────────────────────────────
  DeployPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${AWS::StackName}-pipeline'
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:

        # Stage 1 — download source from GitHub
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GithubConnection
                FullRepositoryId: !Sub '${GitHubOwner}/${GitHubRepo}'
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceArtifact

        - Name: DeployInfrastructure
          Actions:
            - Name: UpdateCICDStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub '${AWS::StackName}'
                TemplatePath: SourceArtifact::infra/cicd.yaml
                TemplateConfiguration: 'SourceArtifact::infra/stack-tags.json'
                Capabilities: CAPABILITY_NAMED_IAM
                RoleArn: !GetAtt CloudFormationDeployRole.Arn
                ParameterOverrides: !Sub |
                  {
                    "GitHubOwner": "${GitHubOwner}",
                    "GitHubRepo": "${GitHubRepo}",
                    "GitHubBranch": "${GitHubBranch}",
                    "WebsiteBucketName": "${WebsiteBucketName}",
                    "ArtifactBucketName": "${ArtifactBucketName}",
                    "FoundationStackName": "${FoundationStackName}"
                  }
              InputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

            - Name: UpdateFrontendStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Ref FoundationStackName
                TemplatePath: SourceArtifact::infra/frontend.yaml
                TemplateConfiguration: 'SourceArtifact::infra/stack-tags.json'
                RoleArn: !GetAtt CloudFormationDeployRole.Arn
                ParameterOverrides: !Sub '{"WebsiteBucketName": "${WebsiteBucketName}"}'
              InputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        # Stage 3 — build the site and upload to the (now-existing) private S3 bucket
        - Name: Build
          Actions:
            - Name: BuildAndDeploy
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact

Outputs:

  CodeStarConnectionArn:
    Description: >
      Activate this connection manually after the stack deploys:
      AWS Console → CodePipeline → Settings → Connections → Update pending connection
    Value: !Ref GithubConnection
