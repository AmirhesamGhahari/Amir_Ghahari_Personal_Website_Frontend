AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CI/CD stack for the portfolio site.
  Creates: CodeStar GitHub connection, artifact S3 bucket, IAM roles, CodeBuild, and CodePipeline.
  The pipeline is self-updating: Stage 2 re-deploys this file (infra/cicd.yaml) automatically
  on every push, and also deploys infra/frontend.yaml to a separate frontend stack.
  After bootstrapping, activate the GitHub connection in the AWS Console
  (CodePipeline → Settings → Connections → Update pending connection).

Parameters:
  GitHubOwner:
    Type: String
    Default: AmirhesamGhahari
    Description: Your GitHub username (e.g. amirhesamghahari)

  GitHubRepo:
    Type: String
    Default: Amir_Ghahari_Personal_Website_Frontend
    Description: Repository name (e.g. amir-ghahari-dev-frontend-repo)

  GitHubBranch:
    Type: String
    Default: main
    Description: Branch to watch for deployments

  WebsiteBucketName:
    Type: String
    Default: amir-ghahari-website-frontend-resources
    Description: S3 bucket name for the site files — must match the name in infra/frontend.yaml

  GithubConnectionName:
    Type: String
    Default: amir-ghahari-github
    Description: Name of Github connection crrated by AWS CodePipeline

  ArtifactBucketName:
    Type: String
    Default: amir-ghahari-frontend-pipeline-artifacts
    Description: S3 bucket name for CodePipeline artifacts — must be globally unique

  FrontendStackName:
    Type: String
    Default: amir-ghahari-website-frontend
    Description: CloudFormation stack name for infra/frontend.yaml (the website S3 bucket stack)

Resources:

  # ── 1. GitHub connection ────────────────────────────────────────────────────
  # Created in PENDING state. After the stack deploys, go to:
  # AWS Console → CodePipeline → Settings → Connections → Update pending connection
  GithubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: !Ref GithubConnectionName
      ProviderType: GitHub

  # ── 2. S3 bucket — CodePipeline artifacts (private) ─────────────────────────
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ArtifactBucketName
      VersioningConfiguration:
        Status: Enabled

  # ── 3. IAM role for CloudFormation ──────────────────────────────────────────
  # CloudFormation assumes this role when Stage 2 deploys infra/cicd.yaml and
  # infra/frontend.yaml. Needs AdministratorAccess because it creates IAM roles,
  # S3 buckets, CodeBuild, CodePipeline, and CodeStar resources.
  CloudFormationDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-cfn-deploy-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  # ── 4. IAM role for CodeBuild ───────────────────────────────────────────────
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-codebuild-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${ArtifactBucket}'
                  - !Sub 'arn:aws:s3:::${ArtifactBucket}/*'
              # The website bucket is private but CodeBuild accesses it via IAM,
              # not public access — so these permissions still work fine.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${WebsiteBucketName}'
                  - !Sub 'arn:aws:s3:::${WebsiteBucketName}/*'

  # ── 5. IAM role for CodePipeline ────────────────────────────────────────────
  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-codepipeline-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref GithubConnection
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${ArtifactBucket}'
                  - !Sub 'arn:aws:s3:::${ArtifactBucket}/*'
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt BuildProject.Arn
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt CodeBuildRole.Arn
                  - !GetAtt CloudFormationDeployRole.Arn

  # ── 6. CodeBuild project ─────────────────────────────────────────────────────
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-build'
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: BUCKET_NAME
            Value: !Ref WebsiteBucketName
      ServiceRole: !GetAtt CodeBuildRole.Arn

  # ── 7. CodePipeline ──────────────────────────────────────────────────────────
  DeployPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${AWS::StackName}-pipeline'
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:

        # Stage 1 — download source from GitHub
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GithubConnection
                FullRepositoryId: !Sub '${GitHubOwner}/${GitHubRepo}'
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceArtifact

        # Stage 2 — two parallel CloudFormation actions
        # Both run at the same time, both read from SourceArtifact.
        # Action 1 self-updates this CI/CD stack from infra/cicd.yaml.
        # Action 2 creates/updates the frontend stack from infra/frontend.yaml.
        # Stage 3 only starts after both actions complete successfully.
        - Name: DeployInfrastructure
          Actions:
            - Name: UpdateCICDStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Sub '${AWS::StackName}'
                TemplatePath: SourceArtifact::infra/cicd.yaml
                Capabilities: CAPABILITY_NAMED_IAM
                RoleArn: !GetAtt CloudFormationDeployRole.Arn
                ParameterOverrides: !Sub |
                  {
                    "GitHubOwner": "${GitHubOwner}",
                    "GitHubRepo": "${GitHubRepo}",
                    "GitHubBranch": "${GitHubBranch}",
                    "WebsiteBucketName": "${WebsiteBucketName}",
                    "ArtifactBucketName": "${ArtifactBucketName}",
                    "FrontendStackName": "${FrontendStackName}"
                  }
              InputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

            - Name: UpdateFrontendStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Ref FrontendStackName
                TemplatePath: SourceArtifact::infra/frontend.yaml
                RoleArn: !GetAtt CloudFormationDeployRole.Arn
                ParameterOverrides: !Sub '{"WebsiteBucketName": "${WebsiteBucketName}"}'
              InputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        # Stage 3 — build the site and upload to the (now-existing) private S3 bucket
        - Name: Build
          Actions:
            - Name: BuildAndDeploy
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact

Outputs:

  CodeStarConnectionArn:
    Description: >
      Activate this connection manually after the stack deploys:
      AWS Console → CodePipeline → Settings → Connections → Update pending connection
    Value: !Ref GithubConnection
